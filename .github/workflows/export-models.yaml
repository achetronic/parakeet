name: export-models

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Version ref for the model image tags (e.g. v1.2.3)'
        type: string
        required: true
      use_master:
        description: 'Export from master instead of the version ref'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

env:
  # Same target as local, but the export runs on CPU, so use the CPU torch wheel.
  PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.inputs.use_master == 'true') && 'master' || github.event.inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install --quiet uv

      - name: Create the export venv
        run: make model-export-asr-venv

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          # GITHUB_TOKEN is unreliable for standalone packages (a second large
          # push can be denied). Use a PAT with write:packages + read:packages.
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Export and push model images
        run: make MODEL_TAG="${{ github.event.inputs.ref }}" model-push-oci-images
