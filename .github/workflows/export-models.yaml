name: export-models

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to export (defaults to master)'
        type: string
        required: false
        default: ''
      use_master:
        description: 'Export from master instead of the ref'
        type: boolean
        required: false
        default: false
      image_tag:
        description: 'Custom tag for the images (defaults to the ref)'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  packages: write

env:
  # Same target as local, but the export runs on CPU, so use the CPU torch wheel.
  PYTORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ (github.event.inputs.use_master == 'true') && 'master' || (github.event.inputs.ref || 'master') }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: pip install --quiet uv

      - name: Create the export venvs
        run: make model-export-asr-venv model-export-diarization-venv

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export and push model images
        run: make MODEL_TAG="${{ github.event.inputs.image_tag || github.event.inputs.ref || 'latest' }}" model-push-oci-images
